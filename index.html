<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF7A3D">
  <title>루틴 트래커</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/character.css">
  <script src="js/date.js" defer></script>
  <script src="js/emoji.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/routines.js" defer></script>
  <script src="js/streak.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/character.js" defer></script>
  <script src="js/screens.js" defer></script>
  <script src="js/sheets.js" defer></script>
  <script src="js/calendar.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- 오류 배너 (저장 데이터 문제·저장 실패 안내) -->
    <div class="banner-error" data-testid="banner-error" role="alert" hidden></div>

    <!-- 상단 토스트 (칭찬 문구 등) -->
    <div class="toast" data-testid="toast" aria-live="polite" role="status" hidden></div>

    <main class="screens">
      <!-- 1. 오늘 -->
      <section class="screen" id="screen-today" data-screen="today" aria-labelledby="today-title">
        <header class="today-header">
          <p class="today-date" id="today-date" data-testid="today-date"></p>
          <h1 class="screen-title" id="today-title">오늘</h1>
          <div class="progress" data-testid="progress" data-done-count="0" data-total="0">
            <div class="progress-inner" id="progress-inner" hidden>
              <p class="progress-text" id="progress-text">오늘 0/0 완료</p>
              <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
          </div>
        </header>

        <div class="empty-state" data-testid="empty-state" id="empty-state" hidden>
          <p class="empty-emoji" aria-hidden="true">🌱</p>
          <p class="empty-text">아직 루틴이 없어요.<br>힘든 날엔 mini 만 해도 이어지는 루틴, 하나 만들어 볼까요?</p>
          <button type="button" class="btn btn-primary" data-testid="btn-first-routine" id="btn-first-routine">첫 루틴 만들기</button>
        </div>

        <ul class="card-list" id="card-list"></ul>
      </section>

      <!-- 2. 캘린더 (저장된 기록을 읽기만 함) -->
      <section class="screen" id="screen-calendar" data-screen="calendar" data-testid="screen-calendar" aria-labelledby="cal-heading" hidden>
        <h1 class="screen-title" id="cal-heading">캘린더</h1>
        <div class="cal-stats">
          <p class="cal-stat"><span class="cal-stat-label">🔥 연속</span> <strong data-testid="cal-streak" data-streak-state="none">0</strong><span>일</span></p>
          <p class="cal-stat"><span class="cal-stat-label">이번 달</span> <strong data-testid="cal-month-count">0</strong><span>일 기록</span></p>
        </div>
        <p class="cal-streak-note" id="cal-streak-note"></p>
        <div class="cal-card">
          <div class="cal-nav">
            <button type="button" class="btn btn-small cal-nav-btn" data-testid="cal-prev" aria-label="이전 달">‹</button>
            <h2 class="cal-title" data-testid="cal-title" aria-live="polite"></h2>
            <button type="button" class="btn btn-small cal-nav-btn" data-testid="cal-next" aria-label="다음 달">›</button>
          </div>
          <div class="cal-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div class="cal-grid" data-testid="cal-grid" data-dir="0"></div>
        </div>
        <div class="cal-detail" data-testid="cal-detail" aria-live="polite"></div>
      </section>

      <!-- 3. 루틴 관리 -->
      <section class="screen" id="screen-manage" data-screen="manage" aria-labelledby="manage-title" hidden>
        <h1 class="screen-title" id="manage-title">루틴 관리</h1>
        <div class="char-mount" data-testid="char-mount" id="char-mount"></div>
        <button type="button" class="btn btn-primary btn-block" data-testid="btn-add-routine" id="btn-add-routine">+ 루틴 추가</button>
        <p class="manage-empty" id="manage-empty" hidden>아직 루틴이 없어요. 위 버튼으로 추가해 보세요.</p>
        <ul class="manage-list" id="manage-list"></ul>
      </section>
    </main>

    <!-- 아래 탭 -->
    <nav class="tabbar" role="tablist" aria-label="화면 바꾸기">
      <button type="button" class="tab" role="tab" data-tab="today" data-testid="tab-today" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">☀️</span><span>오늘</span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="calendar" data-testid="tab-calendar" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">📅</span><span>캘린더</span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="manage" data-testid="tab-manage" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">📝</span><span>루틴 관리</span>
      </button>
    </nav>

    <!-- 루틴 추가·수정 시트 -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden>
      <form class="sheet" data-testid="sheet" id="sheet" hidden novalidate>
        <h2 class="sheet-title" id="sheet-title">루틴 추가</h2>
        <div class="name-row">
          <label class="field field-name">
            <span class="field-label">이름</span>
            <input type="text" name="name" data-testid="input-name" id="input-name" maxlength="100" autocomplete="off" placeholder="예: 운동">
          </label>
          <label class="field field-emoji">
            <span class="field-label">이모지</span>
            <input type="text" name="emoji" data-testid="input-emoji" id="input-emoji" maxlength="20" autocomplete="off" placeholder="🙂" aria-label="이모지 (한 개)">
          </label>
        </div>
        <p class="error-name" data-testid="error-name" id="error-name" role="alert" hidden>루틴 이름을 적어 주세요</p>
        <p class="error-name" data-testid="error-emoji" id="error-emoji" role="alert" hidden>이모지 한 개만 넣어 주세요</p>
        <div class="emoji-pick" data-testid="emoji-pick" id="emoji-pick" role="group" aria-label="추천 이모지">
          <button type="button" class="pick" data-emoji="🏃">🏃</button>
          <button type="button" class="pick" data-emoji="📚">📚</button>
          <button type="button" class="pick" data-emoji="💧">💧</button>
          <button type="button" class="pick" data-emoji="🧘">🧘</button>
          <button type="button" class="pick" data-emoji="💪">💪</button>
          <button type="button" class="pick" data-emoji="🥗">🥗</button>
          <button type="button" class="pick" data-emoji="😴">😴</button>
          <button type="button" class="pick" data-emoji="✍️">✍️</button>
        </div>
        <label class="field">
          <span class="field-label"><span class="dot dot-mini"></span>mini (아주 조금)</span>
          <input type="text" name="mini" data-testid="input-mini" id="input-mini" maxlength="100" autocomplete="off" placeholder="예: 푸시업 5개">
        </label>
        <label class="field">
          <span class="field-label"><span class="dot dot-more"></span>more (보통)</span>
          <input type="text" name="more" data-testid="input-more" id="input-more" maxlength="100" autocomplete="off" placeholder="예: 20분">
        </label>
        <label class="field">
          <span class="field-label"><span class="dot dot-max"></span>max (최고)</span>
          <input type="text" name="max" data-testid="input-max" id="input-max" maxlength="100" autocomplete="off" placeholder="예: 1시간">
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn btn-ghost" data-testid="btn-close" id="btn-close">닫기</button>
          <button type="submit" class="btn btn-primary" data-testid="btn-save" id="btn-save">저장</button>
        </div>
      </form>

      <!-- 삭제 확인창 -->
      <div class="sheet confirm-sheet" data-testid="confirm-sheet" id="confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-text" hidden>
        <p class="confirm-text" data-testid="confirm-text" id="confirm-text"></p>
        <div class="sheet-actions confirm-actions">
          <button type="button" class="btn btn-ghost" data-testid="btn-cancel-delete" id="btn-cancel-delete">취소</button>
          <button type="button" class="btn btn-primary btn-danger-solid" data-testid="btn-confirm-delete" id="btn-confirm-delete">삭제</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
